version: '3.8'

services:
  postgres:
    image: postgres:16.1
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: shareit
      POSTGRES_PASSWORD: shareit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareit -d shareit"]
      interval: 5s
      timeout: 5s
      retries: 5

  shareit-server:
    image: shareit-server
    build:
      context: ./server
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shareit
      SPRING_DATASOURCE_USERNAME: shareit
      SPRING_DATASOURCE_PASSWORD: shareit

  shareit-gateway:
    image: shareit-gateway
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - shareit-server
    environment:
      SHAREIT_SERVER_URL: http://shareit-server:9090